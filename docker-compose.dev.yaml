services:
    cogniz-web:
        container_name: cogniz-web
        build:
            context: ./cogniz-web
            dockerfile: Dockerfile.dev
        init: true
        environment:
            API_INTERNAL_URL: http://cogniz-api:8000
        depends_on:
            cogniz-api:
                condition: service_healthy
        volumes:
            - ./cogniz-web:/app
            - web_node_modules:/app/node_modules
            - web_next:/app/apps/web/.next
        restart: always
        ports:
            - 3000:3000
        networks:
            - my_network

    cogniz-api:
        container_name: cogniz-api
        build:
            context: ./cogniz-api
            dockerfile: Dockerfile.dev
        init: true
        environment:
            DATABASE_URL: postgresql://postgres:password@postgres:5432/cogniz
            ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
            COOKIE_SECURE: "false"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 15s
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./cogniz-api:/app
        restart: always
        ports:
            - "8000:8000"
        networks:
            - my_network

    postgres:
        image: postgres:17
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d cogniz"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: cogniz
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - my_network

volumes:
    web_node_modules:
    web_next:
    postgres_data:

    # Add more containers below (nginx, postgres, etc.)

# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
networks:
    my_network:
        driver: bridge
        # external: true
