services:
  cogniz-web:
    build:
      context: ./cogniz-web
      dockerfile: Dockerfile.dev
    init: true
    environment:
      API_INTERNAL_URL: http://${API_INTERNAL_HOST}:${API_INTERNAL_PORT}
    depends_on:
      cogniz-api:
        condition: service_healthy
    volumes:
      - ./cogniz-web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/apps/web/.next
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS}:${WEB_PORT}:3000"
    networks:
      - cogniz

  cogniz-api:
    build:
      context: ./cogniz-api
      dockerfile: Dockerfile.dev
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      API_INTERNAL_PORT: "8000"
      TASKIQ_WORKERS: ${TASKIQ_WORKERS:-1}
      TASKIQ_MAX_ASYNC_TASKS: ${TASKIQ_MAX_ASYNC_TASKS:-4}
      RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-60}
      RUN_HEARTBEAT_SECONDS: ${RUN_HEARTBEAT_SECONDS:-10}
      RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-3}
      AGENT_HARD_MAX_OUTPUT_TOKENS: ${AGENT_HARD_MAX_OUTPUT_TOKENS:-327680}
      AGENT_HARD_TOTAL_TOKENS_LIMIT: ${AGENT_HARD_TOTAL_TOKENS_LIMIT:-2560000}
      AGENT_HARD_REQUEST_LIMIT: ${AGENT_HARD_REQUEST_LIMIT:-200}
      AGENT_HARD_TOOL_CALLS_LIMIT: ${AGENT_HARD_TOOL_CALLS_LIMIT:-200}
      AGENT_HARD_TIMEOUT_SECONDS: ${AGENT_HARD_TIMEOUT_SECONDS:-36000}
      ALLOWED_ORIGINS: ${WEB_ALLOWED_ORIGINS}
      COOKIE_SECURE: "false"
      API_ROOT_PATH: ""
      AI_PROVIDER_ENCRYPTION_KEY: ${AI_PROVIDER_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 5s
      timeout: 8s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./cogniz-api:/app
    stop_grace_period: 90s
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS}:${API_PORT}:8000"
    networks:
      - cogniz

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - "${POSTGRES_BIND_ADDRESS}:${POSTGRES_PORT}:5432"
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    networks:
      - cogniz

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    ports:
      - "${REDIS_BIND_ADDRESS}:${REDIS_PORT}:6379"
    volumes:
      - ${DATA_DIR}/redis:/data
    networks:
      - cogniz

volumes:
  web_node_modules:
  web_next:

networks:
  cogniz:
    driver: bridge
