services:
    cogniz-web:
        container_name: cogniz-web
        build:
            context: ./cogniz-web
            dockerfile: Dockerfile.dev
        init: true
        volumes:
            - ./cogniz-web:/app
            - web_node_modules:/app/node_modules
            - web_next:/app/apps/web/.next
        restart: always
        ports:
            - 3000:3000
        networks:
            - my_network

    cogniz-api:
        container_name: cogniz-api
        build:
            context: ./cogniz-api
            dockerfile: Dockerfile.dev
        init: true
        volumes:
            - ./cogniz-api:/app
        restart: always
        ports:
            - "8000:8000"
        networks:
            - my_network

    postgres:
        image: postgres:17
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: cogniz
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - my_network

volumes:
    web_node_modules:
    web_next:
    postgres_data:

    # Add more containers below (nginx, postgres, etc.)

# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
networks:
    my_network:
        driver: bridge
        # external: true
