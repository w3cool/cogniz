services:
  cogniz-web:
    image: cogniz-web:prod
    build:
      context: ./cogniz-web
      dockerfile: Dockerfile.prod
      args:
        API_INTERNAL_URL: http://${API_INTERNAL_HOST}:${API_INTERNAL_PORT}
    init: true
    environment:
      API_INTERNAL_URL: http://${API_INTERNAL_HOST}:${API_INTERNAL_PORT}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      cogniz-api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS}:${WEB_PORT}:3000"
    networks:
      - cogniz

  cogniz-api:
    image: cogniz-api:prod
    build:
      context: ./cogniz-api
      dockerfile: Dockerfile.prod
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      API_INTERNAL_PORT: ${API_INTERNAL_PORT}
      API_WORKERS: ${API_WORKERS}
      TASKIQ_WORKERS: ${TASKIQ_WORKERS:-1}
      TASKIQ_MAX_ASYNC_TASKS: ${TASKIQ_MAX_ASYNC_TASKS:-4}
      RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-60}
      RUN_HEARTBEAT_SECONDS: ${RUN_HEARTBEAT_SECONDS:-10}
      RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-3}
      AGENT_HARD_MAX_OUTPUT_TOKENS: ${AGENT_HARD_MAX_OUTPUT_TOKENS:-327680}
      AGENT_HARD_TOTAL_TOKENS_LIMIT: ${AGENT_HARD_TOTAL_TOKENS_LIMIT:-2560000}
      AGENT_HARD_REQUEST_LIMIT: ${AGENT_HARD_REQUEST_LIMIT:-200}
      AGENT_HARD_TOOL_CALLS_LIMIT: ${AGENT_HARD_TOOL_CALLS_LIMIT:-200}
      AGENT_HARD_TIMEOUT_SECONDS: ${AGENT_HARD_TIMEOUT_SECONDS:-36000}
      ALLOWED_ORIGINS: ${WEB_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      API_ROOT_PATH: ${API_PUBLIC_PATH}
      DATABASE_POOL_MIN_SIZE: ${DATABASE_POOL_MIN_SIZE}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT}
      AI_PROVIDER_ENCRYPTION_KEY: ${AI_PROVIDER_ENCRYPTION_KEY:?Set AI_PROVIDER_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 90s
    restart: unless-stopped
    expose:
      - "${API_INTERNAL_PORT}"
    networks:
      - cogniz

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    expose:
      - "5432"
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    networks:
      - cogniz

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - ${DATA_DIR}/redis:/data
    networks:
      - cogniz

networks:
  cogniz:
    driver: bridge
